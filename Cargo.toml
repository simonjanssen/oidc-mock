[package]
name = "oidc-mock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mock OpenID Connect / OAuth 2.0 authorization server for testing"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["oidc", "oauth2", "mock", "testing", "openid"]
categories = ["development-tools::testing", "authentication"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["form", "tokio", "http2"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = "0.4.45"
openidconnect = "4.0.1"
rand = { version = "0.10.4", features = ["thread_rng"] }
rsa = { version = "0.10.0", default-features = false, features = ["encoding"] }
serde = "1.0.229"
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1.44"
